# PodsGrant iOS17 修复版构建工作流
# 作用：从 LNSSPsd/PodsGrant(main，含 fix ios17 addr offset) 云端编译出
#       rootless(-arm64) 与 roothide(-arm64e) 两个 deb，供 Relaxin 安装。
# 用法：
#   1) 在 GitHub 上 Fork 一份 LNSSPsd/PodsGrant 到你自己的账号
#   2) 把本文件放到你 Fork 的 .github/workflows/ 目录下（命名为 build.yml 或保留现名）
#   3) 仓库 Settings → Actions → 允许运行；然后 Actions 页手动 Run workflow
#   4) 跑完后在 Artifacts 里下载 podsgrant-debs，取出 *-arm64e.deb（roothide）
#   5) 用 RootHide Patcher 转装（或 roothide 版直接 Sileo 装）

name: Build PodsGrant (rootless + roothide)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Cache theos
        id: cache-theos
        uses: actions/cache@v6
        with:
          key: pg-theos-cache1
          path: ~/theos

      - name: Install theos, etc.
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/theos/theos.git -q --depth 1 --recursive ~/theos
          cd ~/theos && rm -rf sdks && git clone https://github.com/theos/sdks.git -q --depth 1
          curl -sL https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.3.0/swift-5.8-ubuntu20.04.tar.xz | tar -xJf - -C ~/theos/toolchain/
          sed -i 's/$(ECHO_MERGING)$(ECHO_UNBUFFERED)$(TARGET_LIPO) $(foreach ARCH,$(TARGET_ARCHS),-arch $(ARCH) $(THEOS_OBJ_DIR)\/$(ARCH)\/$(1)) -create -output "$$@"$(ECHO_END)/\0\nifeq ($(THEOS_PACKAGE_SCHEME),rootless)\nifneq ($(filter arm64e,$(TARGET_ARCHS)),)\n\t~\/theos\/allemande\/allemande "$$@"\nendif\nendif/' ~/theos/makefiles/instance/rules.mk
          cd ~/theos && git clone https://github.com/p0358/allemande --depth 1 && cd allemande && g++ -std=c++20 -o allemande main.cpp

      - name: Build rootless package
        run: |
          export THEOS=~/theos
          make -j2 package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Build roothide package
        run: |
          export THEOS=~/theos
          make -j2 package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: Upload debs
        uses: actions/upload-artifact@v7
        with:
          name: podsgrant-debs
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 7
